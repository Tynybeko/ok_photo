<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OK.ru — фото</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0f0f0f;color:#e8e8e8}
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#0f0f0f}
#gate.hidden{display:none}
.gate-box{width:min(320px,92vw);padding:28px 24px;background:#1a1a1a;border-radius:12px;border:1px solid #333;text-align:center}
.gate-box h2{margin:0 0 16px;font-size:1.15rem;font-weight:600}
.gate-box input{width:100%;padding:10px 12px;border:1px solid #444;border-radius:8px;background:#111;color:#fff;font-size:1rem;margin-bottom:12px}
.gate-box input:focus{outline:none;border-color:#5b8def}
.gate-box button{width:100%;padding:10px;border:none;border-radius:8px;background:#5b8def;color:#fff;font-size:1rem;cursor:pointer;font-weight:600}
.gate-box button:hover{background:#4a7de0}
.gate-err{color:#f66;font-size:.85rem;min-height:1.2em;margin-top:8px}
.gate-hint{margin-top:14px;font-size:.8rem}
.gate-hint button{background:none;border:none;color:#8ab4f8;cursor:pointer;padding:0;font-size:inherit;text-decoration:underline}
.gate-hint button:hover{color:#aecbfa}
#app{display:none}
#app.visible{display:block}
header{position:sticky;top:0;z-index:10;background:rgba(15,15,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid #222;padding:12px 16px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.1rem;font-weight:600}
#status{font-size:.85rem;color:#888}
.import-panel{margin-top:12px;padding:12px;background:#1a1a1a;border-radius:8px;border:1px solid #2a2a2a}
.import-panel label{display:block;font-size:.8rem;color:#aaa;margin-bottom:6px}
.import-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.import-row input[type=url]{flex:1;min-width:200px;padding:8px 10px;border:1px solid #444;border-radius:6px;background:#111;color:#fff;font-size:.9rem}
.import-row button,.import-row label.btn{padding:8px 14px;border:none;border-radius:6px;background:#3d6b35;color:#fff;font-size:.9rem;cursor:pointer;white-space:nowrap}
.import-row label.btn{display:inline-block}
.import-row button:disabled,.import-row label.btn.disabled{opacity:.5;pointer-events:none}
.import-row button.secondary{background:#444}
.import-hint{font-size:.75rem;color:#666;line-height:1.4}
#importLog{font-size:.8rem;color:#8ab4f8;min-height:1.2em;margin-top:6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:12px}
.card{position:relative;background:#1a1a1a;border-radius:8px;overflow:hidden;aspect-ratio:1}
.card .ph{position:absolute;inset:0;background:linear-gradient(110deg,#1a1a1a 8%,#252525 18%,#1a1a1a 33%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position-x:-200%}}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s;cursor:pointer}
.card img.loaded{opacity:1}
.card.loaded .ph{display:none}
.card .del{position:absolute;top:6px;right:6px;z-index:5;width:28px;height:28px;border:none;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1;cursor:pointer;opacity:0;transition:opacity .15s}
.card:hover .del,.card .del:focus{opacity:1}
.card .del:hover{background:#c0392b}
.card.selectable{cursor:pointer}
.card.selected{outline:3px solid #5b8def;outline-offset:-3px}
.card .sel-mark{position:absolute;top:6px;left:6px;z-index:6;width:22px;height:22px;border-radius:4px;border:2px solid #fff;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;font-size:14px;line-height:1}
.card.selectable .sel-mark{display:flex}
.card.selected .sel-mark{background:#5b8def;border-color:#5b8def}
.card.selected .sel-mark::after{content:"✓";color:#fff}
.select-bar{display:none;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;background:#252525;border-radius:8px;border:1px solid #333}
.select-bar.active{display:flex}
.select-bar span{flex:1;font-size:.85rem;color:#aaa;min-width:120px}
.select-bar button{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;font-size:.85rem}
.select-bar .btn-del-sel{background:#c0392b;color:#fff}
.select-bar .btn-cancel-sel{background:#444;color:#fff}
#lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.95);align-items:center;justify-content:center;padding:16px 56px;flex-direction:column;touch-action:pan-y}
#lightbox.open{display:flex}
#lightbox .lb-stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-height:calc(100vh - 100px);touch-action:none}
#lightbox img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain;border-radius:4px;user-select:none;-webkit-user-drag:none}
#lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:102;width:48px;height:48px;border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:2rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
#lightbox .lb-nav:hover{background:rgba(255,255,255,.25)}
#lightbox .lb-nav:disabled{opacity:.25;cursor:default}
#lightbox .lb-prev{left:12px}
#lightbox .lb-next{right:12px}
#lightbox .toolbar{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:103}
#lightbox .toolbar button{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem}
#lightbox .btn-del{background:#c0392b;color:#fff}
#lightbox .btn-close{background:#333;color:#fff}
#lightbox .cap{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:.8rem;color:#aaa;max-width:90%;text-align:center;word-break:break-all;z-index:103}
@media (max-width:520px){#lightbox{padding:16px 44px}#lightbox .lb-nav{width:40px;height:40px;font-size:1.6rem}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;padding:10px 18px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-box">
    <h2>Введите пароль</h2>
    <input type="password" id="pwd" placeholder="Пароль" autocomplete="current-password">
    <button type="button" id="pwdBtn">Войти</button>
    <div class="gate-err" id="pwdErr"></div>
    <p class="gate-hint"><button type="button" id="pwdHint">Узнать текущий пароль</button></p>
    <p class="gate-hint" id="pwdUntil" style="color:#666;margin-top:8px"></p>
  </div>
</div>
<div id="app">
  <header>
    <div class="header-row">
      <h1>Фото OK.ru</h1>
      <span id="status">…</span>
      <button type="button" id="btnAdmin" style="padding:8px 14px;border:none;border-radius:6px;background:#444;color:#fff;font-size:.85rem;cursor:pointer">Редактирование</button>
      <button type="button" id="btnSelect" style="display:none;padding:8px 14px;border:none;border-radius:6px;background:#444;color:#fff;font-size:.85rem;cursor:pointer">Выбрать</button>
    </div>
    <div class="select-bar" id="selectBar">
      <span id="selectCount">Выбрано: 0</span>
      <button type="button" class="btn-del-sel" id="btnDeleteSelected">Удалить выбранные</button>
      <button type="button" class="btn-cancel-sel" id="btnCancelSelect">Отмена</button>
    </div>
    <div class="import-panel">
      <label for="profileUrl">Ссылка на профиль Одноклассников</label>
      <div class="import-row">
        <input type="url" id="profileUrl" placeholder="https://ok.ru/profile/123456789/photos">
        <button type="button" id="btnImport">Скачать фото</button>
        <label class="btn" id="photoLabel">1 фото<input type="file" id="photoFile" accept="image/jpeg,image/png,image/webp,image/gif" hidden></label>
        <label class="btn" id="harLabel">HAR файл<input type="file" id="harFile" accept=".har" hidden></label>
      </div>
      <div id="importLog"></div>
      <p class="import-hint">Импорт и удаления общие для всех. На Vercel: в Storage подключите <strong>Blob</strong>, в Settings → Environment Variables добавьте <code>OK_COOKIES</code> (строка Cookie из браузера) для полного альбома OK.ru. Локально: <code>python3 serve.py</code> + <code>cookies.txt</code>.</p>
    </div>
  </header>
  <main id="grid"></main>
</div>
<div id="lightbox" role="dialog" aria-modal="true">
  <div class="toolbar">
    <button class="btn-del" type="button" id="lbDel">Удалить</button>
    <button class="btn-close" type="button" id="lbClose">&times; Закрыть</button>
  </div>
  <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="Предыдущее">&#8249;</button>
  <div class="lb-stage" id="lbStage">
    <img alt="">
  </div>
  <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="Следующее">&#8250;</button>
  <div class="cap"></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  const LS_AUTH = 'ok-gallery-auth';
  const LS_AUTH_PERIOD = 'ok-gallery-auth-period';
  const LS_ADMIN = 'ok-gallery-admin';
  const LS_ADMIN_PWD = 'ok-gallery-admin-pwd';
  const LS_ADMIN_PERIOD = 'ok-gallery-admin-period';
  const LS_PWD_KEY = 'ok-gallery-pwd-key';
  const LS_DELETED = 'ok-gallery-deleted-v2';
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const pwd = document.getElementById('pwd');
  const pwdBtn = document.getElementById('pwdBtn');
  const pwdErr = document.getElementById('pwdErr');
  const pwdHint = document.getElementById('pwdHint');
  const pwdUntil = document.getElementById('pwdUntil');
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const lb = document.getElementById('lightbox');
  const lbStage = document.getElementById('lbStage');
  const lbImg = lbStage.querySelector('img');
  const lbCap = lb.querySelector('.cap');
  const lbPrev = document.getElementById('lbPrev');
  const lbNext = document.getElementById('lbNext');
  const toast = document.getElementById('toast');
  const profileUrl = document.getElementById('profileUrl');
  const btnImport = document.getElementById('btnImport');
  const harFile = document.getElementById('harFile');
  const photoFile = document.getElementById('photoFile');
  const importLog = document.getElementById('importLog');
  const btnAdmin = document.getElementById('btnAdmin');
  const btnSelect = document.getElementById('btnSelect');
  const selectBar = document.getElementById('selectBar');
  const selectCount = document.getElementById('selectCount');
  const btnDeleteSelected = document.getElementById('btnDeleteSelected');
  const btnCancelSelect = document.getElementById('btnCancelSelect');
  const importPanel = document.querySelector('.import-panel');

  let allPhotos = [];
  let deletedSet = new Set();
  let selectedSet = new Set();
  let selectMode = false;
  let loaded = 0;
  let currentId = null;
  let lbIndex = -1;
  let touchStartX = 0;
  let toastT, io, syncTimer;
  let authPeriod = null;
  const useApi = location.protocol.startsWith('http');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function updateStatus() {
    const n = allPhotos.filter(p => !deletedSet.has(p.id)).length;
    status.textContent = n + ' фото' + (useApi ? ' · общая база' : ' · откройте через сервер');
  }

  function isAdmin() {
    return sessionStorage.getItem(LS_ADMIN) === '1' &&
      sessionStorage.getItem(LS_ADMIN_PERIOD) === String(authPeriod);
  }

  async function checkAuth(password) {
    return api('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
  }

  async function ensureAdmin() {
    if (isAdmin()) return true;
    const p = prompt('Пароль для добавления и удаления:');
    if (p === null) return false;
    try {
      const r = await checkAuth(p);
      if (r.role !== 'admin') {
        showToast('Нужен пароль редактирования');
        return false;
      }
      sessionStorage.setItem(LS_ADMIN, '1');
      sessionStorage.setItem(LS_ADMIN_PWD, p);
      sessionStorage.setItem(LS_ADMIN_PERIOD, String(r.period));
      applyAdminUI();
      return true;
    } catch {
      showToast('Неверный пароль');
      return false;
    }
  }

  function visiblePhotos() {
    return allPhotos.filter(p => !deletedSet.has(p.id));
  }

  function updateSelectUI() {
    const n = selectedSet.size;
    selectCount.textContent = 'Выбрано: ' + n;
    btnDeleteSelected.disabled = n === 0;
    grid.querySelectorAll('.card').forEach(card => {
      card.classList.toggle('selected', selectedSet.has(card.dataset.id));
    });
  }

  function setSelectMode(on) {
    selectMode = on;
    if (!on) selectedSet.clear();
    selectBar.classList.toggle('active', on);
    btnSelect.textContent = on ? 'Выбор ✓' : 'Выбрать';
    grid.querySelectorAll('.card').forEach(c => c.classList.toggle('selectable', on));
    updateSelectUI();
  }

  function applyAdminUI() {
    const on = isAdmin();
    if (importPanel) importPanel.style.display = on ? '' : 'none';
    if (btnSelect) btnSelect.style.display = on ? '' : 'none';
    if (btnAdmin) btnAdmin.textContent = on ? 'Редактирование ✓' : 'Редактирование';
    document.querySelectorAll('.del, #lbDel').forEach(el => {
      el.style.display = on ? '' : 'none';
    });
    if (!on) setSelectMode(false);
  }

  function adminHeaders(extra) {
    const pwd = sessionStorage.getItem(LS_ADMIN_PWD) || '';
    return { 'X-Admin-Password': pwd, ...extra };
  }

  async function fetchAuthInfo() {
    if (!useApi) return;
    try {
      const info = await api('/api/auth?_=' + Date.now(), { cache: 'no-store' });
      authPeriod = info.period;
      if (pwdUntil && info.validUntil) {
        const d = new Date(info.validUntil);
        pwdUntil.textContent = 'Пароль действует до ' + d.toLocaleString('ru-RU') +
          ' (меняется каждые ' + (info.rotationDays || 2) + ' дн.)';
      }
      if (localStorage.getItem(LS_AUTH) === '1' &&
          localStorage.getItem(LS_AUTH_PERIOD) !== String(authPeriod)) {
        localStorage.removeItem(LS_AUTH);
        gate.classList.remove('hidden');
        app.classList.remove('visible');
      }
      if (sessionStorage.getItem(LS_ADMIN_PERIOD) !== String(authPeriod)) {
        sessionStorage.removeItem(LS_ADMIN);
        sessionStorage.removeItem(LS_ADMIN_PWD);
        sessionStorage.removeItem(LS_ADMIN_PERIOD);
        applyAdminUI();
      }
    } catch (_) {}
  }

  async function showPasswordHint() {
    let key = localStorage.getItem(LS_PWD_KEY) || '';
    if (!key) key = prompt('Секретное слово (PASSWORD_SECRET из Vercel):') || '';
    if (!key) return;
    try {
      const r = await api('/api/passwords?key=' + encodeURIComponent(key), { cache: 'no-store' });
      localStorage.setItem(LS_PWD_KEY, key);
      const until = new Date(r.validUntil).toLocaleString('ru-RU');
      alert(
        'Просмотр: ' + r.view + '\n' +
        'Редактирование: ' + r.admin + '\n\n' +
        'Действуют до: ' + until + '\n' +
        'Меняются каждые ' + r.rotationDays + ' дня.'
      );
    } catch (e) {
      showToast(e.message || 'Неверный ключ');
    }
  }
  async function api(path, opts) {
    const r = await fetch(path, opts);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  }

  async function loadPhotos() {
    if (!useApi) {
      showToast('Откройте сайт через Vercel или python3 serve.py');
      return;
    }
    allPhotos = await api('/api/photos?_=' + Date.now(), { cache: 'no-store' });
  }

  function loadDeletedLocal() {
    try {
      return new Set(JSON.parse(localStorage.getItem(LS_DELETED) || '[]'));
    } catch {
      return new Set();
    }
  }

  function saveDeletedLocal() {
    localStorage.setItem(LS_DELETED, JSON.stringify([...deletedSet].sort()));
  }

  async function loadDeleted() {
    if (!useApi) {
      try {
        deletedSet = new Set(JSON.parse(localStorage.getItem('ok-gallery-deleted') || '[]'));
      } catch { deletedSet = new Set(); }
      return;
    }
    const local = loadDeletedLocal();
    const remote = await api('/api/deleted?_=' + Date.now(), { cache: 'no-store' });
    deletedSet = new Set([
      ...local,
      ...(Array.isArray(remote) ? remote : []),
    ]);
    saveDeletedLocal();
  }

  async function syncAll() {
    try {
      const prevDeleted = new Set(deletedSet);
      await loadDeleted();
      for (const id of prevDeleted) deletedSet.add(id);
      saveDeletedLocal();
      await loadPhotos();
      renderGallery();
    } catch (_) {}
  }

  function unlock() {
    localStorage.setItem(LS_AUTH, '1');
    localStorage.setItem(LS_AUTH_PERIOD, String(authPeriod ?? ''));
    gate.classList.add('hidden');
    app.classList.add('visible');
    startGallery();
  }

  async function tryLogin() {
    if (!useApi) {
      pwdErr.textContent = 'Откройте через Vercel или serve.py';
      return;
    }
    try {
      const r = await checkAuth(pwd.value);
      if (r.role === 'view' || r.role === 'admin') {
        pwdErr.textContent = '';
        authPeriod = r.period;
        if (r.role === 'admin') {
          sessionStorage.setItem(LS_ADMIN, '1');
          sessionStorage.setItem(LS_ADMIN_PWD, pwd.value);
          sessionStorage.setItem(LS_ADMIN_PERIOD, String(r.period));
        }
        unlock();
      } else {
        pwdErr.textContent = 'Неверный пароль';
        pwd.value = '';
        pwd.focus();
      }
    } catch {
      pwdErr.textContent = 'Неверный пароль';
      pwd.value = '';
      pwd.focus();
    }
  }

  btnAdmin.onclick = () => { if (ensureAdmin()) showToast('Режим редактирования'); };
  btnSelect.onclick = () => {
    if (!ensureAdmin()) return;
    setSelectMode(!selectMode);
  };
  btnCancelSelect.onclick = () => setSelectMode(false);
  btnDeleteSelected.onclick = () => deletePhotos([...selectedSet]);
  pwdHint.onclick = showPasswordHint;

  (async function init() {
    await fetchAuthInfo();
    if (
      localStorage.getItem(LS_AUTH) === '1' &&
      localStorage.getItem(LS_AUTH_PERIOD) === String(authPeriod)
    ) {
      gate.classList.add('hidden');
      app.classList.add('visible');
      startGallery();
    } else {
      pwdBtn.onclick = tryLogin;
      pwd.onkeydown = e => { if (e.key === 'Enter') tryLogin(); };
      pwd.focus();
    }
    if (useApi) setInterval(fetchAuthInfo, 60000);
  })();

  async function startGallery() {
    applyAdminUI();
    await syncAll();
    renderGallery();
    if (useApi) syncTimer = setInterval(syncAll, 2000);
  }

  function renderGallery() {
    const items = visiblePhotos();
    loaded = 0;
    grid.innerHTML = '';
    updateStatus();
    if (!items.length) {
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;padding:40px">Нет фото</p>';
      return;
    }
    items.forEach((item, i) => {
      const card = document.createElement('article');
      card.className = 'card' + (selectMode ? ' selectable' : '');
      if (selectMode && selectedSet.has(item.id)) card.classList.add('selected');
      card.dataset.i = i;
      card.dataset.id = item.id;
      card.innerHTML = '<div class="ph"></div><div class="sel-mark"></div><button class="del" type="button" title="Удалить">&times;</button>';
      card.querySelector('.del').onclick = e => { e.stopPropagation(); deletePhotos([item.id]); };
      card.onclick = e => {
        if (e.target.closest('.del')) return;
        if (selectMode) {
          if (selectedSet.has(item.id)) selectedSet.delete(item.id);
          else selectedSet.add(item.id);
          updateSelectUI();
          return;
        }
      };
      grid.appendChild(card);
    });
    observeCards(items);
  }

  async function deletePhotos(ids) {
    if (!ids.length) return;
    if (!ensureAdmin()) return;
    const msg = ids.length === 1
      ? 'Удалить это фото у всех?'
      : `Удалить ${ids.length} фото у всех?`;
    if (!confirm(msg)) return;
    try {
      if (useApi) {
        const r = await api('/api/deleted', {
          method: 'POST',
          headers: adminHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(ids.length === 1 ? { name: ids[0] } : { names: ids })
        });
        if (Array.isArray(r.deleted)) deletedSet = new Set([...deletedSet, ...r.deleted]);
        else ids.forEach(id => deletedSet.add(id));
        saveDeletedLocal();
        const idSet = new Set(ids);
        allPhotos = allPhotos.filter(p => !idSet.has(p.id));
        ids.forEach(id => selectedSet.delete(id));
        if (currentId && idSet.has(currentId)) closeLightbox();
        else if (lb.classList.contains('open')) showLightboxAt(lbIndex);
        renderGallery();
        showToast('Удалено: ' + ids.length);
      } else {
        ids.forEach(id => deletedSet.add(id));
        localStorage.setItem('ok-gallery-deleted', JSON.stringify([...deletedSet]));
        if (currentId && ids.includes(currentId)) closeLightbox();
        renderGallery();
        showToast('Удалено: ' + ids.length);
      }
    } catch (e) {
      showToast('Ошибка: ' + e.message);
    }
  }

  async function deletePhoto(id) {
    return deletePhotos([id]);
  }

  function showLightboxAt(index) {
    const items = visiblePhotos();
    if (!items.length) { closeLightbox(); return; }
    lbIndex = Math.max(0, Math.min(index, items.length - 1));
    const item = items[lbIndex];
    currentId = item.id;
    lbImg.src = item.url || ('/media/' + encodeURIComponent(item.id));
    lbCap.textContent = (lbIndex + 1) + ' / ' + items.length + ' · ' + item.name;
    lbPrev.disabled = lbIndex <= 0;
    lbNext.disabled = lbIndex >= items.length - 1;
    lb.classList.add('open');
  }

  function openLightbox(id) {
    const items = visiblePhotos();
    const idx = items.findIndex(p => p.id === id);
    if (idx < 0) return;
    showLightboxAt(idx);
  }

  function closeLightbox() {
    lb.classList.remove('open');
    currentId = null;
    lbIndex = -1;
  }

  function goLightbox(delta) {
    if (!lb.classList.contains('open')) return;
    showLightboxAt(lbIndex + delta);
  }

  function mountImage(card, item) {
    if (card.dataset.mounted) return;
    card.dataset.mounted = '1';
    const img = document.createElement('img');
    img.alt = item.name;
    img.decoding = 'async';
    img.loading = 'lazy';
    img.src = item.url || ('/media/' + encodeURIComponent(item.id));
    img.onload = () => { img.classList.add('loaded'); card.classList.add('loaded'); loaded++; updateStatus(); };
    card.insertBefore(img, card.querySelector('.ph'));
    img.onclick = () => openLightbox(item.id);
  }

  function observeCards(items) {
    if (io) io.disconnect();
    io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const i = +e.target.dataset.i;
          mountImage(e.target, items[i]);
          io.unobserve(e.target);
        }
      });
    }, { rootMargin: '200px' });
    grid.querySelectorAll('.card').forEach(c => io.observe(c));
  }

  btnImport.onclick = async () => {
    if (!ensureAdmin()) return;
    const url = profileUrl.value.trim();
    if (!url) { showToast('Вставьте ссылку на профиль'); return; }
    btnImport.disabled = true;
    importLog.textContent = 'Импорт… это может занять несколько минут';
    try {
      const r = await api('/api/import', {
        method: 'POST',
        headers: adminHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ url })
      });
      let msg = `Найдено ${r.found}, добавлено ${r.added}, пропущено ${r.skipped}, ошибок ${r.errors || 0}`;
      if (r.hint) msg += '. ' + r.hint;
      if (r.added === 0) showToast(r.hint || 'Ни одно фото не сохранилось');
      else showToast(`Добавлено ${r.added} фото`);
      importLog.textContent = msg;
      await syncAll();
      renderGallery();
    } catch (e) {
      importLog.textContent = '';
      showToast(e.message);
    } finally {
      btnImport.disabled = false;
    }
  };

  photoFile.onchange = async () => {
    if (!ensureAdmin()) { photoFile.value = ''; return; }
    const file = photoFile.files[0];
    if (!file) return;
    importLog.textContent = 'Загрузка…';
    try {
      await api('/api/upload', {
        method: 'POST',
        body: file,
        headers: adminHeaders({ 'Content-Type': file.type || 'application/octet-stream' })
      });
      importLog.textContent = 'Фото загружено';
      await syncAll();
      renderGallery();
      showToast('Фото добавлено');
    } catch (e) {
      showToast(e.message);
    } finally {
      photoFile.value = '';
    }
  };

  harFile.onchange = async () => {
    if (!ensureAdmin()) { harFile.value = ''; return; }
    const file = harFile.files[0];
    if (!file) return;
    importLog.textContent = 'Разбор HAR…';
    try {
      const r = await api('/api/import/har', {
        method: 'POST',
        body: file,
        headers: adminHeaders({ 'Content-Type': 'application/octet-stream' })
      });
      let msg = `HAR: добавлено ${r.added}, пропущено ${r.skipped}, ошибок ${r.errors || 0}`;
      if (r.fromBody != null) msg += ` (из файла ${r.fromBody}, скачано ${r.downloaded || 0})`;
      if (r.hint) msg += '. ' + r.hint;
      importLog.textContent = msg;
      await syncAll();
      renderGallery();
      if (r.added === 0) showToast(r.hint || 'Ни одно фото не добавилось');
      else showToast(`Добавлено ${r.added} фото`);
    } catch (e) {
      showToast(e.message);
    } finally {
      harFile.value = '';
    }
  };

  document.getElementById('lbClose').onclick = closeLightbox;
  document.getElementById('lbDel').onclick = () => { if (currentId) deletePhoto(currentId); };
  lbPrev.onclick = e => { e.stopPropagation(); goLightbox(-1); };
  lbNext.onclick = e => { e.stopPropagation(); goLightbox(1); };
  lb.onclick = e => { if (e.target === lb) closeLightbox(); };
  lbStage.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].clientX;
  }, { passive: true });
  lbStage.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) goLightbox(dx > 0 ? -1 : 1);
  }, { passive: true });
  document.onkeydown = e => {
    if (!lb.classList.contains('open')) {
      if (e.key === 'Escape' && selectMode) setSelectMode(false);
      return;
    }
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') goLightbox(-1);
    else if (e.key === 'ArrowRight') goLightbox(1);
  };
})();
</script>
</body>
</html>
